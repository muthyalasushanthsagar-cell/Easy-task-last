# ===================================================================
# Easy Task - Standalone / Development H2 File Profile
# Used if MySQL is temporarily offline or for immediate zero-config testing
# Activate with: --spring.profiles.active=h2
# ===================================================================
spring.application.name=Easy Task (H2 File Persistence)
server.port=${SERVER_PORT:8088}

spring.datasource.url=jdbc:h2:file:./data/easytaskdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console available at http://localhost:8088/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.task.scheduling.pool.size=2
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC
